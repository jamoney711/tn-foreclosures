name: TN Foreclosures Weekly Scrape

on:
  schedule:
    - cron: '0 11 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: playwright install chromium

      - run: sudo apt-get install -y libnss3 libnspr4 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libatspi2.0-0t64

      - name: Inspect page elements
        run: |
          python3 -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--no-sandbox'])
            pg=b.new_context(user_agent='Mozilla/5.0').new_page()
            pg.goto('https://foreclosurestn.com/Search.aspx',timeout=30000)
            pg.wait_for_load_state('networkidle',timeout=15000)
            els=pg.evaluate('''() => {
              var o=[];
              document.querySelectorAll(\"select,input[type=checkbox],input[type=text]\").forEach(e=>{
                o.push(e.tagName+\" id=\"+e.id+\" name=\"+e.name+\" type=\"+(e.type||\"\")+\" value=\"+(e.value||\"\").slice(0,30));
              });
              return o.join(\"\\n\");
            }''')
            print(els)
            b.close()
          "
